name: Restore staged aw npm dist-tags

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-dist-tags:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Restore the seven aw dist-tags and verify
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          packages=(aw aw-darwin-arm64 aw-darwin-x64 aw-linux-arm64 aw-linux-x64 aw-windows-x64 aw-windows-arm64)
          for package in "${packages[@]}"; do
            npm dist-tag add "@awebai/${package}@1.36.51" latest
            npm dist-tag add "@awebai/${package}@1.36.53" next
          done
          for package in "${packages[@]}"; do
            tags_json="$(npm view "@awebai/${package}" dist-tags --json)"
            node -e 'const tags=JSON.parse(process.argv[2]); if(tags.latest!=="1.36.51" || tags.next!=="1.36.53") throw new Error("dist-tag readback mismatch for "+process.argv[1]); console.log(process.argv[1]+" "+JSON.stringify(tags));' "@awebai/${package}" "$tags_json"
          done
